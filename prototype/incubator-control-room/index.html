<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Throwaway Market Mate prototype comparing three Principal control-room models."
    />
    <title>Market Mate — Incubator Control Room Prototype</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- Three variants of the Principal control room, switchable via ?variant=, on the disposable /prototype/incubator-control-room/ route. -->
    <main id="app" aria-live="polite"></main>

    <div id="prototype-switcher" class="prototype-switcher" aria-label="Prototype variant switcher">
      <button class="switcher-arrow" type="button" data-direction="previous" aria-label="Previous variant">←</button>
      <div class="switcher-label">
        <span>Prototype</span>
        <strong data-variant-label></strong>
      </div>
      <button class="switcher-arrow" type="button" data-direction="next" aria-label="Next variant">→</button>
    </div>

    <div id="prototype-toast" class="prototype-toast" role="status" aria-live="polite"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
