x-backend-image: &backend-image
  # One image for every Rust service; each service only picks its binary via command.
  image: market-mate-backend
  build:
    context: .
    dockerfile: backend/Dockerfile

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: mm
      POSTGRES_PASSWORD: local-only
      POSTGRES_DB: market_mate
    ports:
      - "127.0.0.1:${MARKET_MATE_POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mm -d market_mate"]
      interval: 5s
      timeout: 3s
      retries: 20

  custody:
    <<: *backend-image
    command: ["custody"]
    environment:
      CUSTODY_DATA_DIR: /var/lib/custody
    ports:
      - "127.0.0.1:${MARKET_MATE_CUSTODY_PORT:-8081}:8081"
    volumes:
      - custodydata:/var/lib/custody
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    <<: *backend-image
    environment:
      DATABASE_URL: postgres://mm:local-only@postgres:5432/market_mate
      CUSTODY_URL: http://custody:8081
    ports:
      - "127.0.0.1:${MARKET_MATE_BACKEND_PORT:-8080}:8080"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      custody:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  paper-connector:
    <<: *backend-image
    command: ["paper-connector"]
    volumes:
      - alpaca-paper-secrets:/var/lib/alpaca-paper:ro
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  paper-credentials:
    <<: *backend-image
    profiles: [setup]
    user: "0:0"
    volumes:
      - alpaca-paper-secrets:/var/lib/alpaca-paper
    entrypoint: ["sh", "-ec"]
    command:
      - 'umask 077; cat > /var/lib/alpaca-paper/credentials.json.new; chown 10001:10001 /var/lib/alpaca-paper/credentials.json.new; chmod 600 /var/lib/alpaca-paper/credentials.json.new; mv /var/lib/alpaca-paper/credentials.json.new /var/lib/alpaca-paper/credentials.json'

  agent-driver:
    <<: *backend-image
    command: ["agent-driver"]
    environment:
      DATABASE_URL: postgres://agent_driver:local-driver-only@postgres:5432/market_mate
    volumes:
      - zai-secrets:/var/lib/zai:ro
      - opencode-secrets:/var/lib/opencode:ro
      - cheaper-inference-secrets:/var/lib/cheaper-inference:ro
      - openrouter-secrets:/var/lib/openrouter:ro
      - cursor-secrets:/var/lib/cursor:ro
      - openrouter-policy:/var/lib/model-policy:ro
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  openrouter-credentials:
    <<: *backend-image
    profiles: [setup]
    user: "0:0"
    volumes:
      - openrouter-secrets:/var/lib/openrouter
    entrypoint: ["sh", "-ec"]
    command:
      - 'umask 077; cat > /var/lib/openrouter/credentials.json.new; chown 10001:10001 /var/lib/openrouter/credentials.json.new; chmod 600 /var/lib/openrouter/credentials.json.new; mv /var/lib/openrouter/credentials.json.new /var/lib/openrouter/credentials.json'

  openrouter-management-credentials:
    <<: *backend-image
    profiles: [setup]
    user: "0:0"
    volumes:
      - openrouter-secrets:/var/lib/openrouter
    entrypoint: ["sh", "-ec"]
    command:
      - 'umask 077; cat > /var/lib/openrouter/management.json.new; chown 10001:10001 /var/lib/openrouter/management.json.new; chmod 600 /var/lib/openrouter/management.json.new; mv /var/lib/openrouter/management.json.new /var/lib/openrouter/management.json'

  cursor-credentials:
    <<: *backend-image
    profiles: [setup]
    user: "0:0"
    volumes:
      - cursor-secrets:/var/lib/cursor
    entrypoint: ["sh", "-ec"]
    command:
      - 'umask 077; cat > /var/lib/cursor/credentials.json.new; chown 10001:10001 /var/lib/cursor/credentials.json.new; chmod 600 /var/lib/cursor/credentials.json.new; mv /var/lib/cursor/credentials.json.new /var/lib/cursor/credentials.json'

  zai-credentials:
    <<: *backend-image
    profiles: [setup]
    user: "0:0"
    volumes:
      - zai-secrets:/var/lib/zai
    entrypoint: ["sh", "-ec"]
    command:
      - 'umask 077; cat > /var/lib/zai/credentials.json.new; chown 10001:10001 /var/lib/zai/credentials.json.new; chmod 600 /var/lib/zai/credentials.json.new; mv /var/lib/zai/credentials.json.new /var/lib/zai/credentials.json'

  opencode-credentials:
    <<: *backend-image
    profiles: [setup]
    user: "0:0"
    volumes:
      - opencode-secrets:/var/lib/opencode
    entrypoint: ["sh", "-ec"]
    command:
      - 'umask 077; cat > /var/lib/opencode/credentials.json.new; chown 10001:10001 /var/lib/opencode/credentials.json.new; chmod 600 /var/lib/opencode/credentials.json.new; mv /var/lib/opencode/credentials.json.new /var/lib/opencode/credentials.json'

  cheaper-inference-credentials:
    <<: *backend-image
    profiles: [setup]
    user: "0:0"
    volumes:
      - cheaper-inference-secrets:/var/lib/cheaper-inference
    entrypoint: ["sh", "-ec"]
    command:
      - 'umask 077; cat > /var/lib/cheaper-inference/credentials.json.new; chown 10001:10001 /var/lib/cheaper-inference/credentials.json.new; chmod 600 /var/lib/cheaper-inference/credentials.json.new; mv /var/lib/cheaper-inference/credentials.json.new /var/lib/cheaper-inference/credentials.json'

  research-agent:
    profiles: [research]
    <<: *backend-image
    entrypoint: ["research-agent"]
    environment:
      DATABASE_URL: postgres://incubator_runner:local-poc-only@postgres:5432/market_mate
      AGENT_DRIVER_URL: http://agent-driver:8083
    volumes:
      - openrouter-policy:/var/lib/model-policy:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      postgres:
        condition: service_healthy
      agent-driver:
        condition: service_healthy

  incubator-chat:
    <<: *backend-image
    command: ["incubator-chat"]
    environment:
      DATABASE_URL: postgres://incubator_chat:local-chat-only@postgres:5432/market_mate
      AGENT_DRIVER_URL: http://agent-driver:8083
    volumes:
      - openrouter-policy:/var/lib/model-policy:ro
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      backend:
        condition: service_healthy
      agent-driver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8085/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  incubator-requests:
    <<: *backend-image
    command: ["incubator-requests"]
    environment:
      DATABASE_URL: postgres://incubator_runner:local-poc-only@postgres:5432/market_mate
      AGENT_DRIVER_URL: http://agent-driver:8083
    volumes:
      - openrouter-policy:/var/lib/model-policy:ro
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      backend:
        condition: service_healthy
      agent-driver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8086/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  market-data:
    <<: *backend-image
    command: ["market-data-service"]
    environment:
      DATABASE_URL: postgres://market_data_service:local-data-only@postgres:5432/market_mate
    volumes:
      - market-data-secrets:/var/lib/market-data
      - alpaca-paper-secrets:/var/lib/alpaca-paper:ro
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8087/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build: ./frontend
    command: ["npm", "run", "start:container"]
    environment:
      MARKET_DATA_URL: http://market-data:8087
      INCUBATOR_REQUESTS_URL: http://incubator-requests:8086
      INCUBATOR_CHAT_URL: http://incubator-chat:8085
      BACKEND_URL: http://backend:8080
      AGENT_DRIVER_URL: http://agent-driver:8083
      PAPER_CONNECTOR_URL: http://paper-connector:8082
    ports:
      - "127.0.0.1:${MARKET_MATE_FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      paper-connector:
        condition: service_healthy
      agent-driver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  custodydata:
  alpaca-paper-secrets:
  openrouter-secrets:
  openrouter-policy:
  cursor-secrets:
  zai-secrets:
  opencode-secrets:
  cheaper-inference-secrets:

  market-data-secrets:
